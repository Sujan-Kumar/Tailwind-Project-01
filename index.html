<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding World</title>
    <!-- CSS Link -->
     <link rel="stylesheet" href="./css/main.css">

     <style>
        section[id]{
            scroll-margin-top: 85px;
        }
     </style>
</head>
<body class="bg-slate-50 text-slate-800">

   <!-- ====================NAVBAR=================== -->
    <header class="bg-[#064E5B] shadow-lg">
       <nav class="container mx-auto px-4 py-4 relative">
            <div class="flex justify-between items-center">

                <!-- Logo -->
                <a class="text-2xl font-extrabold text-white" href="#home">Coding <span class="text-cyan-300">World</span></a>


                <!-- Mobile Menu Checkbox -->
                 <input 
                        type="checkbox"
                        id="menu-toggle"
                        class="peer sr-only"
                        >

                <!-- Hamburger Menu -->
                 <label 
                      for="menu-toggle"
                      class="cursor-pointer text-3xl text-cyan-200 hover:text-white md:hidden" >
                      ☰
                    </label>
                    
                <!-- Navigation Links -->
                <ul class="bg-[#064E5B] hidden peer-checked:flex flex-col
                            text-center absolute top-full left-0 w-full shadow-xl border-t
                            border-cyan-800 space-y-5 md:static md:flex md:flex-row md:items-center 
                            md:space-y-0 md:space-x-7 md:bg-transparent md:w-auto md:py-0 
                            md:shadow-none md:border-0">
                    <li>
                        <a href="#home"
                           class="font-medium text-white
                           hover:text-cyan-300 transition">
                            Home
                        </a>
                    </li>
                    <li>
                        <a href="#services"
                           class="font-medium text-white
                           hover:text-cyan-300 transition">
                          Services
                        </a>
                    </li>
                    <li>
                        <a href="#clients"
                           class="font-medium text-white
                           hover:text-cyan-300 transition">
                           Clients
                      </a>
                    </li>
                    <li>
                        <a href="#contact"
                           class="font-medium text-white
                           hover:text-cyan-300 transition">
                           Contact
                      </a>
                    </li>
                    <li>
                        <a href="#pricing"
                           class="font-medium text-white
                           hover:text-cyan-300 transition">
                          Pricing
                      </a>
                    </li>
                    <li>
                        <a href="#contact"
                           class="inline-block rounded-full
                           bg-cyan-400 px-6 py-2 
                           font-bold text-[#083344]
                           hover:bg-white transition">
                          Get Started
                      </a>
                    </li>
                </ul>
        </div>  
       </nav>
    </header>

</body>
</html>
